# Reusable deployment: called by deploy-staging.yml and deploy-production.yml.
# SSHes to the target server and runs deploy/scripts/deploy.sh, which pulls the images for
# IMAGE_TAG, runs the Prisma migration as a one-off command, restarts the stack and smoke-tests it.
#
# Per-environment configuration (GitHub > Settings > Environments > staging | production):
#   variables: APP_DOMAIN, DEPLOY_PATH, GHCR_PULL_USER
#   secrets:   SSH_HOST, SSH_USER, SSH_KEY, SSH_KNOWN_HOSTS, GHCR_PULL_TOKEN
# See deploy/README.md ("CI/CD") for what each one is.

name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment to deploy to (staging or production)
        required: true
        type: string
      image_tag:
        description: Image tag to deploy (the git commit SHA)
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ vars.APP_DOMAIN }}

    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SSH_OPTS: -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes

    steps:
      - name: Prepare SSH key and known hosts
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Compute image prefix (GHCR requires lowercase)
        run: echo "IMAGE_PREFIX=$(printf 'ghcr.io/%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log the server in to GHCR (token over stdin, never printed)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GHCR_PULL_USER: ${{ vars.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -eu
          if [ -z "$GHCR_PULL_TOKEN" ]; then
            echo "GHCR_PULL_TOKEN not set; assuming the packages are public or the server is already logged in"
            exit 0
          fi
          # shellcheck disable=SC2086,SC2029
          printf '%s' "$GHCR_PULL_TOKEN" | ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io -u '$GHCR_PULL_USER' --password-stdin"

      - name: Check out the matching commit on the server and deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -eu
          # shellcheck disable=SC2086,SC2029
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "set -eu; cd '$DEPLOY_PATH'; git fetch --quiet origin; git checkout --quiet '$IMAGE_TAG'; \
             IMAGE_PREFIX='$IMAGE_PREFIX' sh deploy/scripts/deploy.sh '$IMAGE_TAG'"

      - name: Smoke test from outside the server
        run: |
          set -eu
          for attempt in $(seq 1 15); do
            body="$(curl -fsS --max-time 10 "https://$APP_DOMAIN/api/health" || true)"
            case "$body" in
              *'"status":"ok"'*) echo "healthy: $body"; exit 0 ;;
            esac
            echo "attempt $attempt: not healthy yet"; sleep 4
          done
          echo "::error::https://$APP_DOMAIN/api/health did not return status ok"
          exit 1

      - name: Print service logs on failure
        if: failure()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # shellcheck disable=SC2086,SC2029
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH/deploy' && docker compose -f docker-compose.yml ps && \
             docker compose -f docker-compose.yml logs --no-color --tail=200 api web worker caddy" || true

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

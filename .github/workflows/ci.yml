# Continuous integration: every pull request and every push.
# Runs the same commands as the root package.json (lint, typecheck, test, build) with a PostgreSQL
# service container for API tests. Actions are pinned to commit SHAs (version in the comment).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: '0'
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16.15-alpine3.23
        env:
          POSTGRES_DB: mbc_impact_test
          POSTGRES_USER: mbc
          POSTGRES_PASSWORD: mbc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mbc -d mbc_impact_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://mbc:mbc@localhost:5432/mbc_impact_test

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc) with pnpm store cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint + Prettier)
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Validate Prisma schema and apply migrations to the test database
        run: |
          pnpm --filter @mbc/api exec prisma validate
          if [ -d apps/api/prisma/migrations ]; then
            pnpm --filter @mbc/api exec prisma migrate deploy
          else
            echo "no migrations yet; skipping migrate deploy"
          fi

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

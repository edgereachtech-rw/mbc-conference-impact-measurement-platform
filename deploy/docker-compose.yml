# Production / staging stack for a single VPS (backlog E0-2, E0-4).
#
#   cd deploy && cp .env.example .env   # fill in real values
#   docker compose build && docker compose up -d
#
# Only `caddy` publishes ports. Every other service is reachable on the internal network only.
# Images are pinned to exact tags; never use :latest.
#
# !!! NEVER run `docker compose down -v` in production: it deletes the named volumes
# !!! (pgdata, garagemeta, garagedata, caddy_data) and with them the database, uploaded files and
# !!! TLS certificates. Use `docker compose down` (no -v) or `docker compose stop`.
#
# Object storage: MinIO's Docker images are no longer published (minio/minio was removed from
# Docker Hub and quay.io returns nothing as of 2026-10-28). This stack uses Garage
# (https://garagehq.deuxfleurs.fr, AGPL-3.0, image dxflrs/garage) which speaks the same S3 API.
# The application only sees S3_* variables, so switching to an external bucket (Hetzner Object
# Storage, Backblaze B2, AWS S3) is a .env change plus removing the `garage` service.

name: mbc-impact

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-production}
  APP_DOMAIN: ${APP_DOMAIN}
  EVENT_TIMEZONE: ${EVENT_TIMEZONE:-Africa/Lagos}
  DATABASE_URL: ${DATABASE_URL}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION:-garage}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  MAIL_FROM: ${MAIL_FROM}
  MAIL_CONTACT_EMAIL: ${MAIL_CONTACT_EMAIL:-}
  MAIL_ORGANISER_NAME: ${MAIL_ORGANISER_NAME:-}
  MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
  APP_URL: https://${APP_DOMAIN}
  SESSION_SECRET: ${SESSION_SECRET}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
  SESSION_IDLE_DAYS: ${SESSION_IDLE_DAYS:-7}
  MAGIC_LINK_TTL_MINUTES: ${MAGIC_LINK_TTL_MINUTES:-15}
  AUTH_RATE_LIMIT_PER_EMAIL: ${AUTH_RATE_LIMIT_PER_EMAIL:-3}
  AUTH_RATE_LIMIT_PER_IP: ${AUTH_RATE_LIMIT_PER_IP:-10}
  AUTH_VERIFY_LIMIT_PER_IP: ${AUTH_VERIFY_LIMIT_PER_IP:-20}
  AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-}
  # Caddy is the only client of the api container and lives on the private Docker network.
  TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_RELEASE: ${IMAGE_TAG:-local}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  SEED_TEST_DELEGATES: ${SEED_TEST_DELEGATES:-false}

services:
  # ---------------------------------------------------------------- reverse proxy (the only public service)
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CSP_SCRIPT_EXTRA: ${CSP_SCRIPT_EXTRA:-}
      CSP_CONNECT_EXTRA: ${CSP_CONNECT_EXTRA:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates and ACME account; keep across updates
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *default-logging

  # ---------------------------------------------------------------- Next.js web app
  web:
    image: ${IMAGE_PREFIX:-mbc-impact}/web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose:
      - '33333'
    environment:
      NODE_ENV: production
      PORT: 33333
      HOSTNAME: 0.0.0.0
      APP_DOMAIN: ${APP_DOMAIN}
      SENTRY_DSN: ${SENTRY_DSN:-}
      API_INTERNAL_URL: http://api:44444
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${IMAGE_TAG:-local}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:33333/ > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  # ---------------------------------------------------------------- Express API
  api:
    image: ${IMAGE_PREFIX:-mbc-impact}/api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    expose:
      - '44444'
    environment:
      <<: *app-env
      PORT: 44444
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:44444/health > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  # ---------------------------------------------------------------- pg-boss worker (same image as api)
  worker:
    image: ${IMAGE_PREFIX:-mbc-impact}/api:${IMAGE_TAG:-local}
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    # The api image healthcheck probes HTTP; the worker has none, so check the process instead.
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f "dist/worker.js" > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    environment:
      <<: *app-env
      HEALTHCHECKS_WORKER_URL: ${HEALTHCHECKS_WORKER_URL:-}
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-120}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy # api image build must finish before the worker uses it
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  # ---------------------------------------------------------------- PostgreSQL 16
  db:
    image: postgres:16.15-alpine3.23
    restart: unless-stopped
    expose:
      - '5432'
    shm_size: 256m
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *default-logging

  # ---------------------------------------------------------------- S3-compatible object storage (Garage)
  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    # Single node, one replica: this stack runs on one VPS. Off-site copies are the backup job's duty.
    command: ['/garage', 'server']
    expose:
      - '3900' # S3 API
      - '3903' # admin API (metrics, health)
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    healthcheck:
      # The Garage image has no shell or curl; the CLI talks to the local node over RPC.
      test: ['CMD', '/garage', 'status']
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  # ---------------------------------------------------------------- encrypted off-site backups (E0-7)
  backup:
    # pg_dump -> age -> rclone to an off-site S3 bucket, plus an encrypted copy of the object bucket.
    # Scheduler: 02:00 Africa/Lagos nightly, or hourly with BACKUP_MODE=hourly (12-13 November).
    # Manual run:  docker compose -f docker-compose.yml run --rm backup /backup/backup.sh
    # Restore test: see docs/backup-and-recovery.md
    image: ${IMAGE_PREFIX:-mbc-impact}/backup:${IMAGE_TAG:-local}
    build:
      context: ./backup
    restart: unless-stopped
    environment:
      TZ: ${EVENT_TIMEZONE:-Africa/Lagos}
      PGHOST: db
      PGDATABASE: ${DB_NAME}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_MODE: ${BACKUP_MODE:-nightly}
      BACKUP_AGE_PUBLIC_KEY: ${BACKUP_AGE_PUBLIC_KEY:-}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_RCLONE_CRYPT_PASSWORD: ${BACKUP_RCLONE_CRYPT_PASSWORD:-}
      BACKUP_KEEP_HOURLY: ${BACKUP_KEEP_HOURLY:-48}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      HEALTHCHECKS_BACKUP_URL: ${HEALTHCHECKS_BACKUP_URL:-}
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pgrep crond > /dev/null || exit 1']
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

volumes:
  pgdata:
  garagemeta:
  garagedata:
  caddy_data:
  caddy_config:

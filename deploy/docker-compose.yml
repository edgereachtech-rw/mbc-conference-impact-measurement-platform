# Production / staging stack for a single VPS (backlog E0-2, E0-4).
#
#   cd deploy && cp .env.example .env   # fill in real values
#   docker compose build && docker compose up -d
#
# Only `caddy` publishes ports. Every other service is reachable on the internal network only.
# Images are pinned to exact tags; never use :latest.
#
# !!! NEVER run `docker compose down -v` in production: it deletes the named volumes
# !!! (pgdata, garagemeta, garagedata, caddy_data) and with them the database, uploaded files and
# !!! TLS certificates. Use `docker compose down` (no -v) or `docker compose stop`.
#
# Object storage: MinIO's Docker images are no longer published (minio/minio was removed from
# Docker Hub and quay.io returns nothing as of 2026-10-28). This stack uses Garage
# (https://garagehq.deuxfleurs.fr, AGPL-3.0, image dxflrs/garage) which speaks the same S3 API.
# The application only sees S3_* variables, so switching to an external bucket (Hetzner Object
# Storage, Backblaze B2, AWS S3) is a .env change plus removing the `garage` service.

name: mbc-impact

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-production}
  APP_DOMAIN: ${APP_DOMAIN}
  EVENT_TIMEZONE: ${EVENT_TIMEZONE:-Africa/Lagos}
  DATABASE_URL: ${DATABASE_URL}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION:-garage}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  MAIL_FROM: ${MAIL_FROM}
  SESSION_SECRET: ${SESSION_SECRET}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  # ---------------------------------------------------------------- reverse proxy (the only public service)
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CSP_SCRIPT_EXTRA: ${CSP_SCRIPT_EXTRA:-}
      CSP_CONNECT_EXTRA: ${CSP_CONNECT_EXTRA:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates and ACME account; keep across updates
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *default-logging

  # ---------------------------------------------------------------- Next.js web app
  web:
    image: ${IMAGE_PREFIX:-mbc-impact}/web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      APP_DOMAIN: ${APP_DOMAIN}
      SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  # ---------------------------------------------------------------- Express API
  api:
    image: ${IMAGE_PREFIX:-mbc-impact}/api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    expose:
      - '4000'
    environment:
      <<: *app-env
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/health > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  # ---------------------------------------------------------------- pg-boss worker (same image as api)
  worker:
    image: ${IMAGE_PREFIX:-mbc-impact}/api:${IMAGE_TAG:-local}
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      <<: *app-env
      HEALTHCHECKS_WORKER_URL: ${HEALTHCHECKS_WORKER_URL:-}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy # api image build must finish before the worker uses it
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  # ---------------------------------------------------------------- PostgreSQL 16
  db:
    image: postgres:16.15-alpine3.23
    restart: unless-stopped
    expose:
      - '5432'
    shm_size: 256m
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *default-logging

  # ---------------------------------------------------------------- S3-compatible object storage (Garage)
  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    # Single node, one replica: this stack runs on one VPS. Off-site copies are the backup job's duty.
    command: ['server']
    expose:
      - '3900' # S3 API
      - '3903' # admin API (metrics, health)
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    healthcheck:
      # The Garage image has no shell or curl; the CLI talks to the local node over RPC.
      test: ['CMD', '/garage', 'status']
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  # ---------------------------------------------------------------- backups (placeholder, implemented in E0-7)
  backup:
    # Placeholder: E0-7 replaces this with a job that runs encrypted pg_dump + object sync off-site
    # on BACKUP_SCHEDULE, hourly on conference days, and pings HEALTHCHECKS_BACKUP_URL.
    image: postgres:16.15-alpine3.23
    restart: unless-stopped
    command: ['sh', '-c', 'echo "backup job not implemented yet (E0-7)"; exec sleep infinity']
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      HEALTHCHECKS_BACKUP_URL: ${HEALTHCHECKS_BACKUP_URL:-}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *default-logging

volumes:
  pgdata:
  garagemeta:
  garagedata:
  caddy_data:
  caddy_config:

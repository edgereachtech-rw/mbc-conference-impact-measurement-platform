# Garage configuration for the "offsite" stand-in used by backup/test-local.sh only.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "offsite:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.offsite.internal"

[admin]
api_bind_addr = "[::]:3903"

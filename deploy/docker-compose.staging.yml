# Staging: the production stack (docker-compose.yml) with staging defaults layered on top.
#
#   cd deploy && cp .env.staging.example .env   # fill in real values
#   docker compose up -d --build                # .env names both files in COMPOSE_FILE
#
# or, without COMPOSE_FILE in .env:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build
#
# This file changes nothing about the services themselves: same images, same healthchecks, same
# volumes, same memory limits. What it changes:
#   - the Compose project name, so a staging stack beside a production one on the same host gets
#     its own containers, network and volumes (pgdata, mailpitdata) instead of sharing them
#   - NODE_ENV=staging for api and worker: test registrations may sign in, the seed may create its
#     ten test delegates, and plain-HTTP or Mailpit mail is accepted. Everything else (secure
#     cookies, rate limits, audit) behaves as in production. Set NODE_ENV=production in .env to
#     rehearse the production rules on staging
#   - Sentry events tagged "staging"
#   - the two test-data switches default to on (E0-5): staff rehearse the delegate side here
#   - backups keep less: 7 daily, 4 weekly, 3 monthly, by default
#
# Ports are not set here: the base file reads WEB_PUBLISH, API_PUBLISH, MAILPIT_UI_PUBLISH and
# MAILPIT_SMTP_PUBLISH from .env, and .env.staging.example picks ports that do not collide with a
# production stack on the same host (33332, 44443, 8024, 1024).
#
# Never run `docker compose down -v` here either: staging data is cheap to lose, the habit is not.

name: mbc-impact-staging

x-staging-env: &staging-env
  NODE_ENV: ${NODE_ENV:-staging}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-staging}
  AUTH_ALLOW_TEST_REGISTRATIONS: ${AUTH_ALLOW_TEST_REGISTRATIONS:-true}
  SEED_TEST_DELEGATES: ${SEED_TEST_DELEGATES:-true}

services:
  web:
    environment:
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-staging}

  api:
    environment:
      <<: *staging-env

  worker:
    environment:
      <<: *staging-env

  backup:
    environment:
      BACKUP_MODE: ${BACKUP_MODE:-nightly}
      BACKUP_KEEP_HOURLY: ${BACKUP_KEEP_HOURLY:-24}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-3}
